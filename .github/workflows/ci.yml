# Phase 6.4 — CI. Every PR runs: typecheck, unit suite, and the
# seed-vs-live parity guard. A parity drift fails the build (the plan's
# "parity enforced in CI" exit criterion).
#
# The Playwright E2E suite needs the Docker stack (Postgres/Redis/seed);
# it stays a local pre-merge gate for now (documented in docs/plan/
# phase-6-hardening-and-docs.md). CI keeps the fast, hermetic checks.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Seed-vs-live parity guard
        run: npm run parity
